name: Build APK

on:
  push:
    branches: [peregruz]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
          cp build/outputs/apk/release/*.apk Peregruz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Peregruz-apk
          path: Peregruz.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete peregruz-latest -y --cleanup-tag || true
          gh release create peregruz-latest Peregruz.apk --target "${GITHUB_SHA}" --title "Перегруз" --notes "Скачайте Peregruz.apk и установите на телефон."

      - name: Push APK to apk branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir /tmp/out && cp Peregruz.apk /tmp/out/
          git checkout --orphan peregruz-apk
          git rm -rf -q --cached .
          git clean -fdxq
          cp /tmp/out/Peregruz.apk .
          git add Peregruz.apk
          git commit -q -m "APK for ${GITHUB_SHA}"
          git push -f origin peregruz-apk

      - name: Push build log on failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git checkout --orphan peregruz-log
          git rm -rf -q --cached .
          git clean -fdxq
          cp /tmp/build.log build.log
          git add build.log
          git commit -q -m "Build log for ${GITHUB_SHA}"
          git push -f origin peregruz-log
